[project]
name = "mc-jisho-lens"
version = "0.1.0"
description = "Jisho Lens: capture Japanese text from games, look up readings and meanings, translate on demand."
readme = "README.md"
authors = [
    { name = "Mc Allain Casindad", email = "aizen.no.testing.server@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "PySide6>=6.8",
    "mss>=9.0",
    "Pillow>=10.4",
    "numpy>=2.0",
    "rapidocr>=3.0",
    "onnxruntime>=1.20",
    "winrt-runtime>=3.0",
    "winrt-Windows.Foundation>=3.0",
    "winrt-Windows.Foundation.Collections>=3.0",
    "winrt-Windows.Globalization>=3.0",
    "winrt-Windows.Graphics.Imaging>=3.0",
    "winrt-Windows.Media.Ocr>=3.0",
    "winrt-Windows.Storage.Streams>=3.0",
    "fugashi>=1.3",
    "unidic-lite>=1.0.8",
    "cutlet>=0.4",
]

[project.scripts]
jisho-lens = "jisho_lens.app:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "jisho_lens"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# sample Japanese game lines are kept whole for readability
"tools/make_synthetic_ocr_set.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
